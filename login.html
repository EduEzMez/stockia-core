<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockia — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #1F3A8A;
      --secondary: #3B82F6;
      --accent: #10B981;
      --bg: #F3F4F6;
      --text: #111827;
      --border: #E5E7EB;
      --danger: #EF4444;
      --font: 'Inter', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: linear-gradient(135deg, #1F3A8A 0%, #1e40af 50%, #0f2460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo svg { height: 50px; width: auto; }
    .login-logo p {
      color: rgba(255,255,255,0.7);
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .login-card {
      background: white;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    }

    .login-card h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .login-card p {
      color: #6B7280;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: var(--font);
      font-size: 1rem;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 48px;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .form-control.error { border-color: var(--danger); }

    .input-group { position: relative; }
    .input-group .form-control { padding-right: 48px; }
    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9CA3AF;
      font-size: 1.2rem;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .toggle-pass:hover { color: var(--text); }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--secondary);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover:not(:disabled) {
      background: #2563EB;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59,130,246,0.4);
    }
    .btn-login:disabled { opacity: 0.65; cursor: not-allowed; }

    .alert-error {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FECACA;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }
    .alert-error.show { display: block; }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
      margin-top: 20px;
    }
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: #1F2937;
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      animation: toastIn 0.3s ease;
    }
    .toast.error { background: #7F1D1D; border-left: 3px solid #EF4444; }
    @keyframes toastIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" role="img" aria-label="Stockia">
      <text x="0" y="34" font-family="Inter,sans-serif" font-weight="700" font-size="36" fill="white" letter-spacing="-1">St</text>
      <rect x="42" y="10" width="22" height="22" rx="3" fill="none" stroke="white" stroke-width="3"/>
      <line x1="42" y1="18" x2="64" y2="18" stroke="white" stroke-width="2"/>
      <line x1="49" y1="10" x2="49" y2="18" stroke="white" stroke-width="2"/>
      <line x1="57" y1="10" x2="57" y2="18" stroke="white" stroke-width="2"/>
      <text x="66" y="34" font-family="Inter,sans-serif" font-weight="700" font-size="36" fill="white" letter-spacing="-1">ckia</text>
    </svg>
    <p>Tu inventario, bajo control.</p>
  </div>

  <div class="login-card">
    <h2>Bienvenido/a 👋</h2>
    <p>Ingresá tus datos para continuar</p>

    <div class="alert-error" id="error-msg"></div>

    <div class="form-group">
      <label class="form-label" for="email">Correo electrónico</label>
      <input type="email" class="form-control" id="email" placeholder="tu@email.com" autocomplete="email" autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Contraseña</label>
      <div class="input-group">
        <input type="password" class="form-control" id="password" placeholder="Tu contraseña" autocomplete="current-password">
        <button class="toggle-pass" id="toggle-pass" type="button" title="Ver contraseña">👁️</button>
      </div>
    </div>

    <button class="btn-login" id="btn-login" onclick="doLogin()">
      <span id="btn-text">Ingresar</span>
    </button>
  </div>

  <footer>© <span id="footer-year"></span> Stockia. Todos los derechos reservados.</footer>
</div>

<div id="toast-container"></div>

<script>
  const SUPABASE_URL = 'https://gkwtspgbpqjwvyalwymc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdrd3RzcGdicHFqd3Z5YWx3eW1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MjA1MDAwMDAwMH0.PLACEHOLDER';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Footer año
  document.getElementById('footer-year').textContent = new Date().getFullYear();

  // Si ya hay sesión, redirigir
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'dashboard.html';
  });

  // Toggle contraseña
  const passInput = document.getElementById('password');
  const toggleBtn = document.getElementById('toggle-pass');
  toggleBtn.addEventListener('click', () => {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    toggleBtn.textContent = isPass ? '🙈' : '👁️';
  });

  // Enter key
  document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-login');
    const errMsg = document.getElementById('error-msg');

    errMsg.classList.remove('show');

    if (!email || !password) {
      showError('Por favor completá todos los campos.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div><span>Ingresando...</span>';

    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        let msg = 'Error al ingresar. Verificá tus datos.';
        if (error.message.includes('Invalid login')) msg = 'Email o contraseña incorrectos.';
        if (error.message.includes('Email not confirmed')) msg = 'Debés confirmar tu email primero.';
        showError(msg);
        return;
      }

      // Verificar que el usuario tiene perfil y está activo
      const { data: perfil, error: perfilErr } = await sb
        .from('perfiles')
        .select('activo, rol, empresa_id')
        .eq('id', data.user.id)
        .single();

      if (perfilErr || !perfil) {
        await sb.auth.signOut();
        showError('Tu cuenta no tiene un perfil configurado. Contactá al administrador.');
        return;
      }

      if (!perfil.activo) {
        await sb.auth.signOut();
        showError('Tu cuenta está desactivada. Contactá al administrador.');
        return;
      }

      // Redirigir según rol
      if (perfil.rol === 'admin_global') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'dashboard.html';
      }

    } catch (err) {
      showError('Error de conexión. Intentá de nuevo.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span>Ingresar</span>';
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = '⚠️ ' + msg;
    el.classList.add('show');
    document.getElementById('btn-login').disabled = false;
    document.getElementById('btn-login').innerHTML = '<span id="btn-text">Ingresar</span>';
  }
</script>
</body>
</html>
